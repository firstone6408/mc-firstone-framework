plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url "https://maven.terraformersmc.com/releases" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"firstone-framework" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu - optional, used to open the config screen from the mod list
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// mixins are internal implementation, not API
javadoc {
	exclude '**/mixin/**'
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from(["COPYING", "COPYING.LESSER"]) {
		rename { "${it}_$projectName"}
	}
}

// ---------------------------------------------------------------------------------------------------------------
// In-game dev tests (src/devtest): a separate test mod for development only.
// It is never part of the mod jar: build/remapJar only take the main and client source sets.
// Run: meta/scripts/run_devtest.sh [feature ...]  or  ./gradlew devTest -Pfeatures=<id,id|all>
// ---------------------------------------------------------------------------------------------------------------

sourceSets {
	devtest {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
	}
}

// build compiles the tests too (not into the jar), so a moved or renamed class breaks the build at once
tasks.named("check") {
	dependsOn("compileDevtestJava")
}

configurations {
	// mods the production test run loads next to the mod and the test mod
	devtestRuntimeMods { transitive = false }
}

dependencies {
	devtestRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def devtestJar = tasks.register("devtestJar", Jar) {
	from sourceSets.devtest.output
	archiveClassifier = "devtest-dev"
	destinationDirectory = layout.buildDirectory.dir("devtest")
}

def remapDevtestJar = tasks.register("remapDevtestJar", net.fabricmc.loom.task.RemapJarTask) {
	inputFile = devtestJar.flatMap { it.archiveFile }
	classpath.from(sourceSets.main.output, sourceSets.client.output)
	archiveClassifier = "devtest"
	destinationDirectory = layout.buildDirectory.dir("devtest")
}

tasks.register("devTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "verification"
	description = "Runs the in-game dev tests in a production client (-Pfeatures=<id,id|all> -Ptests=<text>)"
	mods.from(configurations.devtestRuntimeMods, tasks.named("remapJar"), remapDevtestJar)
	runDir = file("run/devtest")
	def features = providers.gradleProperty("features").orElse("all")
	def updateBaselines = providers.gradleProperty("updateBaselines").orElse("false")
	jvmArgs.add(features.map { "-Dfirstone.devtest.features=$it" })
	jvmArgs.add(updateBaselines.map { "-Dfirstone.devtest.updateBaselines=$it" })
	jvmArgs.add(providers.gradleProperty("tests").orElse("").map { "-Dfirstone.devtest.tests=$it" })
	programArgs.addAll("--username", "DevTest")

	// a test run must never be skipped as up to date
	outputs.upToDateWhen { false }

	def summary = file("run/devtest/results/summary.txt")
	doFirst {
		summary.delete()
	}
	doLast {
		if (!summary.exists()) {
			throw new GradleException("Dev tests did not finish: no ${summary}")
		}
		def text = summary.text
		logger.lifecycle(text)
		if (!text.startsWith("PASS")) {
			throw new GradleException("Dev tests failed, see run/devtest/results/")
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
